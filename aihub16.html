  if(t.dataset.key){ const v=t.value.trim(); if(v) state.keys[t.dataset.key]=v; else delete state.keys[t.dataset.key]; saveSoon(); }
  else if(t.id==='persona'){ state.settings.persona=t.value; saveSoon(); }
});
sheetBody.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.key){ save(); const p=P(t.dataset.key); if(state.keys[p.id]&&!state.modelFetchedAt[p.id]) refreshModels(p,{silent:true}); refreshStatusPill(p.id); }
  else if(t.dataset.model){ state.models[t.dataset.model]=t.value; save(); }
  else if(t.id==='autoSpeak'){ state.settings.autoSpeak=t.checked; save(); }
  else if(t.id==='healSw'){ state.settings.heal=t.checked; save(); renderTools(); }
});
function refreshStatusPill(pid){ const el=$('#prov-'+pid+' .spill'); if(!el) return; const [txt,cls]=provStatus(P(pid)); el.textContent=txt; el.className='spill '+cls; }
sheetBody.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act, p=P(b.dataset.p);
  if(act==='eye'){ const i=$(`#prov-${p.id} input[data-key]`); i.type=i.type==='password'?'text':'password'; }
  else if(act==='models'){ b.classList.add('spin'); await refreshModels(p); b.classList.remove('spin'); }
  else if(act==='test') testProvider(p);
  else if(act==='export') exportConv();
  else if(act==='wipe'){
    if(!b.classList.contains('armed')){ b.classList.add('armed'); b.lastChild.textContent=' Emin misin? Tekrar dokun'; setTimeout(()=>{ if(b.isConnected){ b.classList.remove('armed'); b.lastChild.textContent=' Tüm sohbetleri sil'; } },3000); return; }
    if(busy) stopAll();
    state.convs=[]; state.currentId=null; save(); renderAll(); renderSheet(); toast('Tüm sohbetler silindi');
  }
});
async function testProvider(p){
  const out=$('#test-'+p.id);
  if(!state.keys[p.id]){ out.innerHTML='<span class="bad">Önce anahtarı gir.</span>'; return; }
  if(busy||testing){ out.innerHTML='<span class="muted">Devam eden istek bitince tekrar dene.</span>'; return; }
  testing=true; out.innerHTML='<span class="muted">Test ediliyor…</span>';
  const prev=live.controller; live.controller=new AbortController();
  const m={id:uid(),pid:p.id,text:'',pending:true};
  const r=await streamInto(m,p,[{role:'user',content:'Sadece "OK" yaz.'}],null,{timeout:30000});
  live.controller=prev; testing=false;
  const html=r.ok?`<span class="good">✓ Çalışıyor · ${fmtMs(m.ms)} · ${esc(m.model)}</span>`:`<span class="bad">${esc(m.error||'Başarısız')}</span>`;
  refreshProvCard(p.id); const o2=$('#test-'+p.id); if(o2) o2.innerHTML=html;
}
function exportConv(){
  const c=currentConv();
  if(!c||!c.msgs.length){ toast('İndirilecek sohbet yok'); return; }
  const L=[`# ${c.title}`,new Date(c.created).toLocaleString('tr-TR'),''];
  c.msgs.forEach(m=>{
    if(m.role==='user'){ L.push('## Sen'+(m.mode&&m.mode!=='sohbet'?` (${MODES[m.mode].label})`:''),m.text||'(görsel)'); if(m.healed) L.push('','> İyileştirilmiş istem: '+m.healed); L.push(''); }
    else if(m.role==='assistant') L.push(`## ${P(m.pid)?.name||'Asistan'} (${m.model||''})`,m.error||m.text,'');
    else if(m.role==='compare') m.items.forEach(it=>L.push(`## ${P(it.pid)?.name} (${it.model})${it.medal!=null?' '+['🥇','🥈','🥉'][it.medal]:''}`,it.error||it.text,''));
    else if(m.role==='company'){ L.push('## Mikro-ajan şirketi',`Kadro: ${m.roster.map(a=>a.ad+' ('+a.rol+')').join(', ')}`,'','### Tartışma'); m.events.forEach(e=>L.push(`- ${m.roster[e.i]?.ad} → ${e.to>=0?m.roster[e.to]?.ad:'herkes'} [${e.type}]: ${e.text}`)); L.push('','### Konsensüs raporu',m.report||m.error||'',''); }
    else if(m.role==='debate'){ L.push('## Münazara'); m.items.forEach(it=>L.push(`### ${P(it.pid)?.name} · Cevap ${it.letter}${m.scores?.[it.letter]?` · ${m.scores[it.letter].t}/10`:''}`,it.text||it.error||'')); L.push('','### Nihai cevap',m.final||m.error||'',''); }
    else if(m.role==='pipeline'){ L.push('## Üretim bandı'); m.stations.forEach((s,i)=>L.push(`### ${i+1}. ${s.ad} (${P(s.pid)?.name})`,s.text||s.error||'')); L.push('','### Sonuç',m.final||m.error||'',''); }
  });
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([L.join('\n')],{type:'text/markdown;charset=utf-8'}));
  a.download=(c.title.replace(/[^\wçğıöşüÇĞİÖŞÜ -]/g,'').trim().slice(0,40)||'sohbet')+'.md';
  document.body.appendChild(a); a.click(); a.remove();
}

const cv=$('#scene'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,lastDraw=0,lastHud=0;
function rr(x,y,w,h,r){ ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x,y,w,h,r); else ctx.rect(x,y,w,h); }
function wrapText(text,maxW,maxLines){
  const words=String(text).split(/\s+/), lines=[]; let cur='', i=0;
  for(;i<words.length;i++){ const t=cur?cur+' '+words[i]:words[i]; if(ctx.measureText(t).width<=maxW){ cur=t; continue; } if(cur) lines.push(cur); cur=words[i]; if(lines.length===maxLines) break; }
  if(lines.length<maxLines&&cur){ lines.push(cur); i=words.length; }
  if(i<words.length||lines.some(l=>ctx.measureText(l).width>maxW)){ let l=lines[lines.length-1]||''; while(l.length>1&&ctx.measureText(l+'…').width>maxW) l=l.slice(0,-1); lines[lines.length-1]=l+'…'; }
  return lines;
}
function centerMsg(a,b){
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='600 14px Inter, system-ui, sans-serif'; ctx.fillStyle='rgba(238,234,255,.85)'; ctx.fillText(a,W/2,H/2-10);
  if(b){ ctx.font='500 12px Inter, system-ui, sans-serif'; ctx.fillStyle='rgba(154,148,191,.85)'; ctx.fillText(b,W/2,H/2+12); }
}

function drawRoom(d,now){

  if(DY-HORIZON>44){ const ry=Math.round((HORIZON+DY)/2)+2; R(54,ry-6,108,13,'#191235'); R(54,ry-6,108,1,'#2e2160'); R(54,ry+6,108,1,'#2e2160'); for(let x=58;x<160;x+=6) R(x,ry,2,1,'#2a1f52'); }
  // pencere: gökyüzü gerçek saate göre

  const wx=6,wy=8,ww=40,wh=28;

  else { const f=clamp((h-6)/13.5,0,1); R(wx+2+f*(ww-9),wy+3+Math.abs(f-.5)*10,5,5,'#fde047'); }
  BUILD.forEach(([bx,by,bw],k)=>{ R(wx+bx,wy+by,bw,wh-by,night?'#0b0920':'#1e1b4b'); if(night) for(let yy=by+2;yy<wh-1;yy+=3) for(let xx=1;xx<bw-1;xx+=2) if((xx*7+yy*3+k*5)%5===0) R(wx+bx+xx,wy+yy,1,1,'#fcd34d'); });
  R(wx+ww/2,wy,1,wh,'#2b1f52'); R(wx,wy+wh/2,ww,1,'#2b1f52'); R(wx-3,wy+wh+2,ww+6,2,'#3a2a6a');
  // duvar saati

  // sunucu rafı: son 8 isteğin sonucu, sağlayıcısı ve süresi

  const recs=state.recent.slice(-8);
  for(let k=0;k<8;k++){
    const y=9+k*5, r=recs[recs.length-1-k]; R(196,y,14,3,'#15102b');
    if(!r){ R(197,y+1,2,1,'#241c3f'); continue; }
    const c=r.ok===true?'#34d399':r.ok===false?'#fb7185':r.ok==='stop'?'#8e89b3':(Math.floor(now/180)%2?'#fbbf24':'#5a4310');
    R(197,y+1,2,1,c); R(200,y+1,3,1,P(r.pid)?.color||'#666');

  }
  [[2,LHd-22],[207,LHd-22]].forEach(([x,y])=>{ R(x,y+6,6,5,'#7a3b1c'); R(x-1,y+1,8,5,'#1f9d62'); R(x+1,y-1,4,2,'#34d399'); });

function drawLinks(now){
  PROVIDERS.forEach((p,i)=>{
    if(!state.keys[p.id]) return;
    const st=provState(p,now), a=HUBP, b=deskP(i);
    const dir=(st==='wait'||st==='think')?1:(st==='stream'||st==='type')?-1:0;
    const gap=4, ph=dir?Math.floor(now/70)%gap:0;
    const col=dir?p.color:st==='err'?'#7f1d3a':mix(p.color,'#0b0819',.72);
    const dx=b.x-a.x, dy=b.y-a.y, n=Math.max(Math.abs(dx),Math.abs(dy));
    for(let k=0;k<=n;k++){ const kk=dir===-1?n-k:k; if(((kk-ph)%gap+gap)%gap!==0) continue; R(a.x+dx*k/n,a.y+dy*k/n,1,1,col); }
  });
}
function drawChar(x,y,color,st,now){
  const sleep=st==='off', skin='#f2c9a0';
  R(x+8,y+4,2,12,'#2a2150'); R(x-1,y+14,11,2,'#2a2150'); R(x+3,y+16,2,6,'#1d1838'); R(x,y+21,8,1,'#1d1838');
  const hy=sleep?y+4:st==='done'?y-1:y;
  R(x,y+7,8,7,color); R(x,y+7,8,1,mix(color,'#ffffff',.3)); R(x+3,y+8,2,1,mix(color,'#000000',.35));
  R(x+1,hy,6,6,skin); R(x+1,hy,6,2,'#2b1a12'); R(x+1,hy+2,1,1,'#2b1a12');
  if(sleep){ R(x+2,hy+3,2,1,'#6b4a3a'); R(x+5,hy+3,1,1,'#6b4a3a'); }
  else if(Math.floor(now/110)%36!==0){ R(x+2,hy+3,1,1,'#1a1020'); R(x+5,hy+3,1,1,'#1a1020'); }
  if(st==='err') R(x+3,hy+5,2,1,'#9b3a3a');
  if(st==='type'){ const a=Math.floor(now/80)%2; R(x-3,y+9+a,3,1,skin); R(x-3,y+11-a,3,1,skin); }
  else if(st==='done'){ R(x-1,y+2,1,5,color); R(x+8,y+2,1,5,color); R(x-1,y+1,1,1,skin); R(x+8,y+1,1,1,skin); }
  else if(sleep){ R(x-3,y+10,4,2,color); }
  else R(x-2,y+10,2,2,skin);
  if(sleep){ for(let k=0;k<2;k++){ const t=((now/1000)+k*.5)%1, zx=x+9+k*3+Math.round(t*2), zy=y-1-Math.round(t*7); R(zx,zy,3,1,'#8e89b3'); R(zx+1,zy+1,1,1,'#8e89b3'); R(zx,zy+2,3,1,'#8e89b3'); } }
  if(st==='wait'||st==='think'){
    const bc=st==='think'?'#f9a8d4':'#cfc9ff';
    R(x+9,y-2,1,1,bc); R(x+10,y-8,9,5,bc); R(x+11,y-9,7,1,bc); R(x+11,y-3,7,1,bc);
    const n=Math.floor(now/260)%4; for(let k=0;k<Math.min(3,n);k++) R(x+11+k*3,y-6,2,1,'#3b2a5c');
  }
}
function drawMonitor(x,y,p,st,now,i){
  R(x,y,22,15,'#1c1636'); R(x,y,22,1,'#2e2558');
  const X=x+2,Y=y+2,w=18, lp=live.prov[p.id];
  R(X,Y,w,10,{off:'#020205',err:'#3a0b17',cool:'#2b1f05',full:'#2b1f05',done:'#05261b'}[st]||'#070b1a');
  if(st==='idle'){ R(X+1,Y+1,1,1,p.color); R(X+2,Y+2,1,1,p.color); R(X+1,Y+3,1,1,p.color); if(Math.floor(now/530)%2) R(X+4,Y+3,2,1,p.color); }
  else if(st==='wait'||st==='think'){ const n=Math.floor(now/250)%4; for(let k=0;k<n;k++) R(X+5+k*3,Y+4,2,2,p.color); }
  else if(st==='stream'||st==='type'){
    const CPL=28, total=Math.floor(lp.chars/CPL), start=Math.max(0,total-4);
    for(let r=0;r<5;r++){ const li=start+r; if(li>total) break; const len=li===total?Math.max(1,Math.round((lp.chars%CPL)/CPL*(w-2))):4+((li*37+i*11)%(w-6)); R(X+1,Y+1+r*2,len,1,li===total?'#ffffff':p.color); }
  }
  else if(st==='done'){ [[5,5],[6,6],[7,7],[8,6],[9,5],[10,4],[11,3],[12,2]].forEach(([a,b])=>R(X+a,Y+b,1,2,'#34d399')); }
  else if(st==='err'){ R(X+8,Y+1,2,5,'#fb7185'); R(X+8,Y+7,2,2,'#fb7185'); }
  else if(st==='cool'){ const rem=Math.max(0,(live.cooldown[p.id]-now)/(live.coolTotal[p.id]||60000)); R(X+1,Y+4,Math.round((w-2)*rem),2,'#fbbf24'); }
  else if(st==='full'){ R(X+1,Y+4,w-2,2,'#fbbf24'); }
  const led=st==='off'?'#2a2440':st==='err'?'#fb7185':(st==='cool'||st==='full')?'#fbbf24':['wait','think','stream','type'].includes(st)?(Math.floor(now/200)%2?'#fbbf24':'#6b4d0c'):'#34d399';
  R(x+19,y+13,1,1,led);
  R(x+9,y+15,4,1,'#1c1636'); R(x+7,y+16,8,1,'#1c1636');
}

function fpx(size){ return Math.max(8,Math.round(size*sc)); }
function pxText(t,x,y,color,size){ ctx.font=`${fpx(size)}px "Press Start 2P", monospace`; ctx.fillStyle=color; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(t,sx(x),sy(y)); }
function monoText(t,x,y,color){ ctx.font=`600 ${Math.max(9,Math.round(5.4*sc))}px "JetBrains Mono", monospace`; ctx.fillStyle=color; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(t,sx(x),sy(y)); }
function pxBubble(x,y,text,kind){

  ctx.font=`${fpx(4)}px "Press Start 2P", monospace`;
  const tw=ctx.measureText(text).width, bw=tw+12, bh=fpx(4)+9, px=sx(x), py=sy(y);
  ctx.fillStyle='rgba(7,5,15,.92)'; ctx.strokeStyle=col; ctx.lineWidth=1;

function drawOffice(now){
  const d=new Date(now);
  drawRoom(d,now); drawLinks(now); drawHub(now);
  PROVIDERS.forEach((p,i)=>drawDesk(i,p,provState(p,now),now));
  ctx.fillStyle='#110c22'; ctx.fillRect(0,0,W,sy(HORIZON));
  ctx.fillStyle='#0b0819'; ctx.fillRect(0,sy(HORIZON),W,H);
  const lw=Math.max(1,sc);
  ctx.fillStyle='#150f2b'; for(let x=ox+4*sc-Math.ceil((ox+4*sc)/(12*sc))*12*sc;x<W;x+=12*sc) ctx.fillRect(x,0,lw,sy(HORIZON-2));
  ctx.fillStyle='#120d26'; for(let x=ox-Math.ceil(ox/(16*sc))*16*sc;x<W;x+=16*sc) ctx.fillRect(x,sy(HORIZON),lw,H);
  for(let y=HORIZON+8;sy(y)<H;y+=10) ctx.fillRect(0,sy(y),W,lw);
  ctx.fillStyle='#2b1f52'; ctx.fillRect(0,sy(HORIZON-2),W,2*sc);
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(off,0,0,LW,LHd,ox,oy,LW*sc,LHd*sc);

let replayTok=0;

function coSyncRoster(co){
  const m=co.m, n=m.roster.length; if(!n){ co.agents=[]; return; }
  const k=Math.max(1,(m.teams||[]).length), gap=0.9, slots=n+k*gap;
  const order=m.roster.map((a,i)=>i).sort((x,y)=>(m.roster[x].team-m.roster[y].team)||x-y);

    agents[i]={i,ang:-Math.PI/2+(s+0.5)/slots*Math.PI*2,count:old?.count||0,lastAt:old?.lastAt||0,lastType:old?.lastType||null,appear:old?old.appear:now+j*70}; s+=1; });

}
function coEvent(ev,anim){

  for(let x=0;x<ev.tags.length;x++) for(let y=x+1;y<ev.tags.length;y++){ const A=co.tags.get(ev.tags[x]),B=co.tags.get(ev.tags[y]); A.links.set(B.name,(A.links.get(B.name)||0)+1); B.links.set(A.name,(B.links.get(A.name)||0)+1); }

}
function coReplay(m){

const nodeR=n=>Math.min(18,4+Math.sqrt(n.count)*3.2);
function coPhysics(co,cx,cy,irx,iry){
  const ns=[...co.tags.values()]; if(!ns.length) return 0;
  ns.forEach(n=>{ if(n.x==null){ const a=co.agents[n.src]; const ax=a&&a.x!=null?a.x:cx, ay=a&&a.y!=null?a.y:cy; n.x=cx+(ax-cx)*0.45+(Math.random()-.5)*10; n.y=cy+(ay-cy)*0.45+(Math.random()-.5)*10; } });
  for(let i=0;i<ns.length;i++) for(let j=i+1;j<ns.length;j++){
    const a=ns[i],b=ns[j]; let dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy;
    if(d2<1){ dx=Math.random()-.5; dy=Math.random()-.5; d2=1; }
    const d=Math.sqrt(d2), minD=nodeR(a)+nodeR(b)+28, f=Math.min(2.2,(minD*minD)/d2*0.35), fx=dx/d*f, fy=dy/d*f;
    a.vx-=fx; a.vy-=fy; b.vx+=fx; b.vy+=fy;

  ns.forEach(a=>{ a.links.forEach((w,bn)=>{ const b=co.tags.get(bn); if(!b) return; const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,f=(d-70)*0.0016*Math.min(3,w); a.vx+=dx/d*f; a.vy+=dy/d*f; }); a.vx+=(cx-a.x)*0.0035; a.vy+=(cy-a.y)*0.005; });

  if(m.phase==='done'){ ctx.font='700 10px Inter, system-ui, sans-serif'; ctx.fillStyle='#34d399'; ctx.textAlign='right'; ctx.textBaseline='top'; ctx.fillText('ÇIKIŞ ✓',W-L.pad,L.beltY+18); }
  // çalışan istasyonun canlı çıktısından son satır
  if(act>=0&&st[act].text){ const tail=st[act].text.replace(/\s+/g,' ').slice(-140); ctx.font='12px "JetBrains Mono", monospace'; ctx.fillStyle='rgba(205,198,240,.75)'; ctx.textAlign='center'; ctx.textBaseline='top'; const ln=wrapText(tail,W-40,2); ln.forEach((l,k)=>ctx.fillText(l,W/2,L.beltY+34+k*16)); }
}

/* ---------- görünüm yönetimi ---------- */
function latestOf(role){ const c=currentConv(); if(!c) return null; for(let i=c.msgs.length-1;i>=0;i--) if(c.msgs[i].role===role) return c.msgs[i]; return null; }
function loadStageForConv(){
  replayTok++;
  const cm=latestOf('company');
  if(!live.co||!cm||live.co.msgId!==cm.id){ live.co=cm?coBuild(cm):null; if(cm) cm.events.forEach(ev=>coEvent(ev,false)); }
  const pm=latestOf('pipeline'); if(!live.pl||live.pl!==pm){ live.pl=pm; live.plMove=null; }
  hideInfo(); lastDraw=0;
}
function setView(v){
  live.view=v;
  document.querySelectorAll('#tabs .tab').forEach(b=>b.classList.toggle('on',b.dataset.view===v));
  if(v==='company'&&!live.co){ const cm=latestOf('company'); if(cm){ live.co=coBuild(cm); cm.events.forEach(ev=>coEvent(ev,false)); } }
  if(v==='pipeline'&&!live.pl) live.pl=latestOf('pipeline');
  if(state.settings.stageCollapsed){ state.settings.stageCollapsed=false; applyStage(); save(); }
  hideInfo(); lastDraw=0;
}
function setMax(on){
  $('#app').classList.toggle('stage-max',on);
  $('#stageMax').innerHTML=ic(on?'shrink':'expand');
  $('#stageMax').setAttribute('aria-label',on?'Canlı ekranı küçült':'Canlı ekranı büyüt');
  if(on&&state.settings.stageCollapsed){ state.settings.stageCollapsed=false; applyStage(); save(); }
  if(!on) setTimeout(()=>scrollBottom(),50);
  lastDraw=0;
}
document.querySelectorAll('#tabs .tab').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
$('#stageMax').addEventListener('click',()=>setMax(!$('#app').classList.contains('stage-max')));
$('#stagePill').addEventListener('click',()=>{
  const id=live.stagePill?.id; live.stagePill=null; setMax(false);
  setTimeout(()=>{ const el=chat.querySelector(`[data-id="${id}"]`); if(el) el.scrollIntoView({block:'start',behavior:'smooth'}); },80);
});
function showInfo(html){ const el=$('#coInfo'); el.innerHTML=`<button class="icon-btn sm info-x" data-act="info-close" aria-label="Kapat">${ic('x')}</button>`+html; el.hidden=false; }
function hideInfo(){ $('#coInfo').hidden=true; if(live.co) live.co.sel=null; }
$('#coInfo').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  if(b.dataset.act==='info-close') hideInfo();
  else if(b.dataset.act==='goto'){ const id=b.dataset.id; hideInfo(); setMax(false); setTimeout(()=>{ const el=chat.querySelector(`[data-id="${id}"]`); if(el) el.scrollIntoView({block:'start',behavior:'smooth'}); },80); }
});
cv.addEventListener('click',e=>{
  const x=e.offsetX, y=e.offsetY;
  if(live.view==='company'&&live.co){
    const co=live.co, m=co.m;
    const ai=co.agents.findIndex(a=>a&&a.x!=null&&Math.hypot(a.x-x,a.y-y)<16);
    if(ai>=0){
      const a=m.roster[ai], evs=m.events.filter(ev=>ev.i===ai).slice(-4);
      co.sel={kind:'agent',i:ai};
      showInfo(`<div class="ih"><span class="adot" style="background:${P(a.pid)?.color}"></span><b>${esc(a.ad)}</b> · ${esc(a.rol)}</div><div class="isub">${esc(P(a.pid)?.name||'')} canlandırıyor · ${co.agents[ai].count} mesaj</div>${a.neden?`<div class="itext">${esc(a.neden)}</div>`:''}${evs.map(ev=>tline(m,ev)).join('')}`);
      lastDraw=0; return;
    }
    let hit=null; co.tags.forEach(n=>{ if(n.x!=null&&Math.hypot(n.x-x,n.y-y)<nodeR(n)+8) hit=n; });
    if(hit){
      const evs=m.events.filter(ev=>ev.tags.includes(hit.name)).slice(-6);
      co.sel={kind:'tag',name:hit.name};
      const rel=[...hit.links.entries()].sort((a,b)=>b[1]-a[1]).slice(0,5).map(([t])=>esc(t));
      showInfo(`<div class="ih"><b>#${esc(hit.name)}</b></div><div class="isub">${hit.count} kez geçti${rel.length?' · ilişkili: '+rel.join(', '):''}</div>${evs.map(ev=>tline(m,ev)).join('')}`);
      lastDraw=0; return;
    }
    hideInfo(); lastDraw=0;
  }else if(live.view==='pipeline'&&live.pl&&live.pl.stations.length){
    const m=live.pl, L=plLayout(m);
    const i=m.stations.findIndex((s,k)=>Math.abs(L.x(k)-x)<L.bw/2&&y>=L.top&&y<=L.top+L.bh);
    if(i>=0){ const s=m.stations[i]; showInfo(`<div class="ih"><span class="idx">${i+1}</span><b>${esc(s.ad)}</b></div><div class="isub">${esc(P(s.pid)?.name||'')} · ${esc(s.model||'')}${s.ms?' · '+fmtMs(s.ms):''}</div><div class="itext">${esc(s.gorev)}</div>${s.text?`<div class="itext" style="white-space:pre-wrap">${esc(trunc(plain(s.text),420))}</div>`:''}<button class="act" data-act="goto" data-id="${m.id}">${ic('down')}<span>Sohbette aç</span></button>`); }
    else hideInfo();
  }
});

function updateStageHead(now){
  const sts=$('#sts');
  if(!sts.children.length) sts.innerHTML=PROVIDERS.map(p=>`<span class="st" id="st-${p.id}"><span class="sdot"></span><b>${p.name}</b><em></em></span>`).join('');
  PROVIDERS.forEach(p=>{
    const st=provState(p,now), el=$('#st-'+p.id), dot=el.firstElementChild, em=el.lastElementChild;
    const cls='sdot '+DOT_CLS[st]; if(dot.className!==cls) dot.className=cls;
    const txt=['wait','think','stream','type','cool','full','err'].includes(st)?STATE_TXT[st]:'';
    if(em.textContent!==txt) em.textContent=txt;
    el.title=p.name+': '+STATE_TXT[st];
  });
  const tps=tokRate();
  const html=tps?`<b class="live">${tps}</b> tok/sn`:`<span class="rl">Bugün </span><b>${todayTotal()}</b> istek`;
  if($('#rate').innerHTML!==html) $('#rate').innerHTML=html;
  const pill=$('#stagePill'), maxOn=$('#app').classList.contains('stage-max');
  const show=!!(live.stagePill&&maxOn);
  if(pill.hidden===show){ pill.hidden=!show; }
  if(show){ const h=`${ic('down')}${esc(live.stagePill.text)}`; if(pill.innerHTML!==h) pill.innerHTML=h; }
}
function resizeScene(){
  const r=cv.getBoundingClientRect(); W=r.width; H=r.height; if(!W||!H) return;
  DPR=Math.min(3,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  if(W/H>LW/120){ sc=H/120; LHd=120; ox=(W-LW*sc)/2; oy=0; }
  else{ sc=W/LW; LHd=Math.max(120,Math.floor(H/sc)); ox=0; oy=(H-LHd*sc)/2; }
  DY=LHd-48;
  if(off.height!==LHd) off.height=LHd;
  lastDraw=0;
}
if(window.ResizeObserver) new ResizeObserver(resizeScene).observe(cv); else window.addEventListener('resize',resizeScene);

function loop(){
  requestAnimationFrame(loop);
  const now=Date.now(), pn=performance.now();
  if(pn-lastHud>250){ lastHud=pn; updateStageHead(now); }
  if(document.hidden||state.settings.stageCollapsed||document.body.classList.contains('short')||!W) return;
  let moving;
  if(live.view==='company'){ const co=live.co; moving=!!co&&(co.flights.length>0||co.speech.length>0||co.energy>0.25||pn-co.lastEventAt<1500||co.m.pending||co.agents.some(a=>a&&pn-a.appear<400)); }
  else if(live.view==='pipeline'){ const m=live.pl; moving=!!m&&(m.pending||(live.plMove&&pn-live.plMove.t0<800)); }
  else moving=live.inflight>0||live.packets.length||live.rings.length||now-live.typingAt<600||PROVIDERS.some(p=>live.cooldown[p.id]>now||(live.prov[p.id].bubble&&live.prov[p.id].bubble.until>now));
  if(!moving&&pn-lastDraw<125) return;   // boştayken ~8 fps: pil dostu
  lastDraw=pn;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(live.view==='company') drawCompany(now); else if(live.view==='pipeline') drawPipeline(now); else drawOffice(now);
}

function applyStage(){ $('#stage').classList.toggle('collapsed',!!state.settings.stageCollapsed); requestAnimationFrame(resizeScene); }
$('#stageToggle').addEventListener('click',()=>{ state.settings.stageCollapsed=!state.settings.stageCollapsed; if(state.settings.stageCollapsed) setMax(false); save(); applyStage(); });
function checkShort(){ document.body.classList.toggle('short',window.innerHeight<520); }
window.addEventListener('resize',checkShort);

/* =====================================================================
   BAŞLAT
   ===================================================================== */
$('#menuBtn').innerHTML=ic('menu'); $('#newBtn').innerHTML=ic('plus'); $('#settingsBtn').innerHTML=ic('sliders');
$('#stageToggle').innerHTML=ic('chev').replace('class="ic"','class="ic chev"'); $('#stageMax').innerHTML=ic('expand');
$('#attachBtn').innerHTML=ic('clip'); $('#micBtn').innerHTML=ic('mic'); $('#attachX').innerHTML=ic('x');
$('#drawerNew').innerHTML=ic('plus')+'Yeni'; $('#drawerClose').innerHTML=ic('x'); $('#sheetClose').innerHTML=ic('x');
document.querySelectorAll('[data-icon]').forEach(el=>{ el.outerHTML=ic(el.dataset.icon); });
$('#menuBtn').addEventListener('click',openDrawer);
$('#drawerClose').addEventListener('click',closeDrawer);
$('#newBtn').addEventListener('click',()=>newConv());
$('#drawerNew').addEventListener('click',()=>newConv());
$('#settingsBtn').addEventListener('click',openSheet);
$('#sheetClose').addEventListener('click',closeSheet);

if(!currentConv()) state.currentId=state.convs[0]?.id||null;
checkShort(); applyStage(); renderAll(); setSendUI(); autoGrow(); setView('office');
requestAnimationFrame(loop);
document.fonts&&document.fonts.load('8px "Press Start 2P"').then(()=>{ lastDraw=0; }).catch(()=>{});
setTimeout(autoRefreshModels,1200);
log('sys','AI Hub hazır');
</script>
