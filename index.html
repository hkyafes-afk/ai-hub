<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05040b">
<link rel="manifest" href="manifest.json">
<title>AI Hub</title>
<style>
  :root{
    --bg:#05040b; --panel:rgba(18,14,34,.78); --panel2:#110d24; --line:rgba(167,139,250,.16);
    --text:#eee9ff; --dim:#8c84ab;
    --pink:#ff2d95; --cyan:#22d3ee; --green:#34d399; --violet:#a78bfa; --amber:#fbbf24;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(120% 60% at 50% -10%,#2a0b3d 0%,transparent 60%),
               radial-gradient(90% 50% at 100% 100%,#082a33 0%,transparent 60%),var(--bg);
    color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;overflow:hidden;min-height:100vh;
  }
  body::after{ /* hafif tarama çizgisi */
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.06;
    background:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px);
  }

  /* ---------- BAŞLIK ---------- */
  header{
    position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
    background:linear-gradient(95deg,#ff2d95 0%,#c026d3 55%,#7c3aed 100%);
    box-shadow:0 8px 30px -8px rgba(255,45,149,.55);
    z-index:2;
  }
  .brand{display:flex;align-items:center;gap:10px}
  .logo{
    width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
    background:rgba(0,0,0,.28);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);font-size:18px;
  }
  .brand h1{font-size:17px;letter-spacing:2px;font-weight:800;text-shadow:0 0 14px rgba(255,255,255,.35)}
  .brand small{display:block;font-size:10px;letter-spacing:1.5px;opacity:.8;font-weight:500}
  .hright{display:flex;align-items:center;gap:8px}
  .clock{font-variant-numeric:tabular-nums;font-size:12px;opacity:.9;background:rgba(0,0,0,.25);padding:5px 9px;border-radius:999px}
  .btn{
    border:0;color:#fff;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;
    background:rgba(0,0,0,.28);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);transition:transform .15s;
  }
  .btn:active{transform:scale(.96)}

  /* ---------- AJAN KARTLARI ---------- */
  .agents{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:12px 12px 4px}
  .agent{
    position:relative;overflow:hidden;border-radius:14px;padding:10px;background:var(--panel);
    border:1px solid var(--c,#333);box-shadow:0 0 22px -10px var(--c),inset 0 1px 0 rgba(255,255,255,.04);
    backdrop-filter:blur(6px);
  }
  .agent::before{ /* üst ışık şeridi */
    content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--c);
    box-shadow:0 0 12px var(--c);opacity:.9;
  }
  .a-head{display:flex;align-items:center;gap:7px}
  .avatar{
    width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:14px;flex:none;
    background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c);
    box-shadow:0 0 12px -2px var(--c);
  }
  .a-name{font-weight:800;font-size:12.5px;letter-spacing:.3px;color:var(--c)}
  .a-role{font-size:9px;color:var(--dim);letter-spacing:1px}
  .led{margin-left:auto;width:7px;height:7px;border-radius:50%;background:#3b3558;flex:none}
  .led.ok{background:var(--green);box-shadow:0 0 10px var(--green)}
  .led.busy{background:var(--amber);box-shadow:0 0 10px var(--amber);animation:blink .8s infinite}
  .led.err{background:var(--pink);box-shadow:0 0 10px var(--pink)}
  @keyframes blink{50%{opacity:.25}}
  .agent select{
    margin-top:8px;width:100%;appearance:none;-webkit-appearance:none;background:#0c0a1a;color:var(--text);
    border:1px solid var(--line);border-radius:8px;padding:6px 22px 6px 7px;font-size:10.5px;
    background-image:linear-gradient(45deg,transparent 50%,var(--c) 50%),linear-gradient(135deg,var(--c) 50%,transparent 50%);
    background-position:calc(100% - 11px) 52%,calc(100% - 7px) 52%;background-size:4px 4px;background-repeat:no-repeat;
  }
  .a-spark{height:34px;margin-top:6px}
  .a-spark svg{width:100%;height:100%;display:block;overflow:visible}
  .a-row{display:flex;justify-content:space-between;align-items:baseline;font-size:10px;color:var(--dim);margin-top:2px}
  .a-row b{color:var(--text);font-variant-numeric:tabular-nums;font-size:11px}
  .a-bar{height:3px;border-radius:3px;background:#1e1838;margin-top:6px;overflow:hidden}
  .a-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c),#fff);box-shadow:0 0 8px var(--c);transition:width .5s}
  .a-bar i.run{width:70%;animation:scan 1.1s ease-in-out infinite}
  @keyframes scan{0%{transform:translateX(-100%)}100%{transform:translateX(150%)}}

  /* ---------- AĞ SAHNESİ ---------- */
  .stage{position:relative;margin:10px 12px 0;height:270px;border-radius:18px;overflow:hidden;border:1px solid var(--line);
    background:radial-gradient(circle at 50% 50%,#1d0f3d 0%,#0a0718 65%,#05040b 100%)}
  .stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .chip{
    position:absolute;z-index:1;font-size:10px;letter-spacing:1px;padding:4px 8px;border-radius:999px;
    background:rgba(5,4,11,.6);border:1px solid var(--line);color:var(--dim);backdrop-filter:blur(4px);
  }
  .chip b{color:var(--text)}
  #chipTL{left:10px;top:10px}
  #chipBR{right:10px;bottom:10px;color:var(--green)}

  /* ---------- BAKİYE + LOG ---------- */
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 12px 0}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0;position:relative;overflow:hidden}
  .p-title{font-size:9.5px;letter-spacing:1.5px;color:var(--dim);display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .p-title span:first-child{color:var(--text)}
  .balance{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--green);text-shadow:0 0 16px rgba(52,211,153,.45)}
  .balance small{font-size:10px;color:var(--dim);font-weight:500;margin-left:4px;text-shadow:none}
  #chart{width:100%;height:64px;display:block;margin-top:4px}
  #log{height:124px;overflow-y:auto;font:10.5px/1.45 ui-monospace,Menlo,Consolas,monospace;color:#b9b2d6;scrollbar-width:thin}
  .ln{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ln .ts{color:#5c5680;margin-right:4px}
  .ln.ok{color:var(--green)} .ln.err{color:#ff7ab8} .ln.req{color:var(--cyan)} .ln.sys{color:var(--violet)}

  /* ---------- SOHBET ---------- */
  #chat{flex:1;overflow-y:auto;padding:12px 12px 6px;display:flex;flex-direction:column;gap:10px;min-height:120px}
  .empty{margin:auto;text-align:center;color:var(--dim);font-size:13px;line-height:1.6;padding:12px}
  .empty b{color:var(--text);font-size:15px;display:block;margin-bottom:4px}
  .msg{max-width:86%;padding:10px 12px;border-radius:16px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word;animation:pop .28s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
  .msg.user{align-self:flex-end;background:linear-gradient(135deg,#7c3aed,#c026d3);color:#fff;border-bottom-right-radius:5px;box-shadow:0 6px 20px -8px #c026d3}
  .msg.bot{align-self:flex-start;background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:5px;border-left:3px solid var(--c,var(--violet))}
  .msg.err{border-color:rgba(255,45,149,.5);color:#ffc2e0}
  .tag{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:800;letter-spacing:.8px;margin-bottom:5px;color:var(--c,var(--cyan))}
  .tag em{font-style:normal;color:var(--dim);font-weight:500;letter-spacing:0}
  .tag .ms{margin-left:auto;background:rgba(255,255,255,.06);padding:2px 6px;border-radius:6px;color:var(--text);font-weight:600}
  .typing{display:inline-flex;gap:4px;padding:4px 2px}
  .typing i{width:6px;height:6px;border-radius:50%;background:var(--c,var(--violet));animation:bounce 1s infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-5px);opacity:1}}
  .compare{display:grid;grid-template-columns:1fr;gap:8px;align-self:stretch}
  .compare .msg{max-width:none}

  /* ---------- ALT BAR ---------- */
  footer{
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,rgba(18,14,34,.6),rgba(10,8,22,.95));border-top:1px solid var(--line);
  }
  .targets{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
  .targets::-webkit-scrollbar{display:none}
  .tgt{
    flex:none;background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:999px;
    padding:5px 11px;font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;
  }
  .tgt.on{color:#fff;border-color:transparent;background:linear-gradient(90deg,#ff2d95,#a855f7);box-shadow:0 0 16px -2px #ff2d95}
  .inputrow{display:flex;gap:8px;align-items:flex-end}
  textarea{
    flex:1;resize:none;background:#0c0a1a;color:var(--text);border:1px solid var(--line);border-radius:14px;
    padding:11px 12px;font:inherit;font-size:14px;height:46px;max-height:120px;outline:none;transition:border-color .2s,box-shadow .2s;
  }
  textarea:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(255,45,149,.18)}
  #send{
    height:46px;min-width:76px;border:0;border-radius:14px;color:#fff;font-weight:800;font-size:14px;cursor:pointer;
    background:linear-gradient(135deg,#ff2d95,#a855f7);box-shadow:0 8px 22px -8px #ff2d95;transition:transform .15s,opacity .2s;
  }
  #send:active{transform:scale(.95)}
  #send:disabled{opacity:.45;cursor:default}

  /* ---------- AYARLAR ---------- */
  #modal{position:fixed;inset:0;background:rgba(3,2,8,.72);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
  #modal.show{display:flex;animation:fade .2s}
  @keyframes fade{from{opacity:0}}
  .sheet{background:#110d24;border:1px solid var(--line);border-radius:18px;padding:18px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto;box-shadow:0 30px 80px -20px #000}
  .sheet h3{margin-bottom:6px;font-size:17px;background:linear-gradient(90deg,#ff2d95,#a855f7);-webkit-background-clip:text;color:transparent}
  .sheet .lead{font-size:12px;color:var(--dim);margin-bottom:8px;line-height:1.5}
  .sheet label{display:block;font-size:12px;color:var(--text);margin:12px 0 5px;font-weight:600}
  .sheet input{width:100%;background:#0c0a1a;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:13px;outline:none}
  .sheet input:focus{border-color:var(--cyan)}
  .sheet small{display:block;color:var(--dim);font-size:11px;margin-top:5px}
  .sheet small a{color:var(--cyan)}
  .sheet .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
  .sheet .btn{background:#241d42}
  .sheet .btn.primary{background:linear-gradient(135deg,#ff2d95,#a855f7);box-shadow:0 6px 18px -6px #ff2d95}

  @media (max-width:480px){
    .pair{grid-template-columns:1fr}
    .agent select{font-size:10px}
    .a-role{display:none}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">✦</div>
    <div><h1>AI HUB</h1><small>ÇOKLU AJAN · ÜCRETSİZ KATMAN</small></div>
  </div>
  <div class="hright">
    <span class="clock" id="clock">--:--</span>
    <button class="btn" id="openSettings">Anahtarlar</button>
  </div>
</header>

<section class="agents" id="agents"></section>

<section class="stage" id="stage">
  <canvas id="net"></canvas>
  <div class="chip" id="chipTL">AĞ · <b id="nodeCount">0</b> AJAN</div>
  <div class="chip" id="chipBR">● CANLI</div>
</section>

<section class="pair">
  <div class="panel">
    <div class="p-title"><span>TOKEN AKIŞI</span><span id="pctTxt">—</span></div>
    <div class="balance"><span id="balance">0</span><small>token</small></div>
    <canvas id="chart"></canvas>
  </div>
  <div class="panel">
    <div class="p-title"><span>SİSTEM LOG</span><span id="logCount">0</span></div>
    <div id="log"></div>
  </div>
</section>

<section id="chat"><div class="empty" id="emptyMsg"><b>Hazır.</b>Bir soru yaz ya da hepsine birden sor.</div></section>

<footer>
  <div class="targets" id="targets"></div>
  <div class="inputrow">
    <textarea id="input" placeholder="Bir şey yaz..."></textarea>
    <button id="send">Gönder</button>
  </div>
</footer>

<div id="modal">
  <div class="sheet">
    <h3>API Anahtarları</h3>
    <p class="lead">Anahtarlar sadece bu cihazın tarayıcısında saklanır. Başkasıyla paylaşma.</p>
    <div id="keyFields"></div>
    <div class="row">
      <button class="btn" id="cancelSettings">Kapat</button>
      <button class="btn primary" id="saveSettings">Kaydet</button>
    </div>
  </div>
</div>

<script>
/* ============ SAĞLAYICILAR (ücretsiz katman) ============ */
const PROVIDERS = [
  { id:'groq', name:'Groq', glyph:'⚡', color:'#22d3ee', role:'HIZ',
    base:'https://api.groq.com/openai/v1', keyUrl:'https://console.groq.com/keys',
    models:['llama-3.3-70b-versatile','openai/gpt-oss-120b','qwen/qwen3-32b','llama-3.1-8b-instant'],
    limit:'30 istek/dk · ~1000/gün' },
  { id:'gemini', name:'Gemini', glyph:'✦', color:'#34d399', role:'GENEL',
    base:'https://generativelanguage.googleapis.com/v1beta/openai', keyUrl:'https://aistudio.google.com/apikey',
    models:['gemini-2.5-flash','gemini-2.5-flash-lite'],
    limit:'AI Studio ücretsiz kota' },
  { id:'openrouter', name:'OpenRouter', glyph:'◈', color:'#a78bfa', role:'ÇEŞİTLİ',
    base:'https://openrouter.ai/api/v1', keyUrl:'https://openrouter.ai/keys',
    models:['openai/gpt-oss-120b:free','meta-llama/llama-3.3-70b-instruct:free','qwen/qwen3-coder:free'],
    limit:'ücretsiz modeller · 50/gün' }
];

/* ============ DURUM ============ */
const STORE='aihub.v2';
const load=()=>{ try{return JSON.parse(localStorage.getItem(STORE))||{}}catch{return{}} };
const persist=()=>{ try{localStorage.setItem(STORE,JSON.stringify(state))}catch{} };
const state=load();
state.keys=state.keys||{}; state.models=state.models||{};
state.stats=state.stats||{req:0,tok:0,err:0};
const lat={}; PROVIDERS.forEach(p=>lat[p.id]=[]);       // gecikme geçmişi (bellekte)
const busy={}; const tokHist=[0];
let target='auto';

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>new Date().toTimeString().slice(0,8);

/* ============ LOG ============ */
function log(kind,msg){
  const el=document.createElement('div');
  el.className='ln '+kind;
  el.innerHTML=`<span class="ts">${now()}</span>${esc(msg)}`;
  const box=$('log'); box.appendChild(el);
  while(box.children.length>80) box.removeChild(box.firstChild);
  box.scrollTop=box.scrollHeight;
  $('logCount').textContent=box.children.length;
}

/* ============ AJAN KARTLARI ============ */
function spark(p){
  const a=lat[p.id].slice(-20);
  if(a.length<2) return `<svg viewBox="0 0 200 34" preserveAspectRatio="none"><line x1="0" y1="30" x2="200" y2="30" stroke="${p.color}" stroke-opacity=".25" stroke-dasharray="3 4"/></svg>`;
  const max=Math.max(...a), min=Math.min(...a), span=Math.max(max-min,1);
  const pts=a.map((v,i)=>{
    const x=i*(200/(a.length-1));
    const y=30-((v-min)/span)*24;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  });
  const area=`0,34 ${pts.join(' ')} 200,34`;
  return `<svg viewBox="0 0 200 34" preserveAspectRatio="none">
    <defs><linearGradient id="g-${p.id}" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="${p.color}" stop-opacity=".45"/><stop offset="1" stop-color="${p.color}" stop-opacity="0"/></linearGradient></defs>
    <polygon points="${area}" fill="url(#g-${p.id})"/>
    <polyline points="${pts.join(' ')}" fill="none" stroke="${p.color}" stroke-width="1.6" vector-effect="non-scaling-stroke" style="filter:drop-shadow(0 0 3px ${p.color})"/>
  </svg>`;
}

function renderAgents(){
  $('agents').innerHTML = PROVIDERS.map(p=>{
    const hasKey=!!state.keys[p.id];
    const model=state.models[p.id]||p.models[0];
    const last=lat[p.id].slice(-1)[0];
    const ledCls=busy[p.id]?'busy':hasKey?'ok':'';
    return `
    <div class="agent" style="--c:${p.color}">
      <div class="a-head">
        <div class="avatar">${p.glyph}</div>
        <div><div class="a-name">${p.name}</div><div class="a-role">${p.role}</div></div>
        <span class="led ${ledCls}" id="led-${p.id}"></span>
      </div>
      <select data-prov="${p.id}">
        ${p.models.map(m=>`<option value="${m}" ${m===model?'selected':''}>${m}</option>`).join('')}
      </select>
      <div class="a-spark">${spark(p)}</div>
      <div class="a-row"><span>${hasKey?esc(p.limit):'Anahtar yok'}</span><b>${last!=null?last+' ms':'—'}</b></div>
      <div class="a-bar"><i id="bar-${p.id}" class="${busy[p.id]?'run':''}"></i></div>
    </div>`;
  }).join('');
  document.querySelectorAll('#agents select').forEach(sel=>{
    sel.onchange=e=>{ state.models[e.target.dataset.prov]=e.target.value; persist(); log('sys',`${e.target.dataset.prov} modeli: ${e.target.value}`); };
  });
  $('nodeCount').textContent=PROVIDERS.filter(p=>state.keys[p.id]).length;
}

/* ============ HEDEF SEÇİMİ ============ */
function renderTargets(){
  const opts=[['auto','Otomatik'],['all','Hepsi · karşılaştır'],...PROVIDERS.map(p=>[p.id,p.name])];
  $('targets').innerHTML=opts.map(([id,label])=>`<button class="tgt ${target===id?'on':''}" data-t="${id}">${label}</button>`).join('');
  $('targets').querySelectorAll('.tgt').forEach(b=>b.onclick=()=>{ target=b.dataset.t; renderTargets(); });
}

/* ============ AĞ SAHNESİ (canvas) ============ */
const cv=$('net'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,hub,provNodes=[],sats=[],stars=[],packets=[],rings=[],t=0;

function resizeNet(){
  DPR=window.devicePixelRatio||1;
  const r=cv.getBoundingClientRect(); W=r.width; H=r.height;
  cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  hub={x:W/2,y:H/2};
  const R=Math.min(W,H)*0.34;
  provNodes=PROVIDERS.map((p,i)=>({p,a:-Math.PI/2+i*(2*Math.PI/PROVIDERS.length),R}));
  sats=Array.from({length:16},(_,i)=>({
    x:Math.random()*W, y:Math.random()*H, r:1+Math.random()*2.2,
    c:PROVIDERS[i%PROVIDERS.length].color, ph:Math.random()*6.28, vx:(Math.random()-.5)*.12, vy:(Math.random()-.5)*.12
  }));
  stars=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.2+.2,ph:Math.random()*6.28}));
}
window.addEventListener('resize',()=>{ resizeNet(); drawChart(); });

function provPos(n){
  const ang=n.a+t*0.0004;
  return {x:hub.x+Math.cos(ang)*n.R, y:hub.y+Math.sin(ang)*n.R*0.85};
}
function bez(a,b,k){ // eğri bağlantı üzerinde nokta
  const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
  const dx=b.x-a.x, dy=b.y-a.y;
  const cx=mx-dy*0.22, cy=my+dx*0.22;
  const u=1-k;
  return {x:u*u*a.x+2*u*k*cx+k*k*b.x, y:u*u*a.y+2*u*k*cy+k*k*b.y, cx, cy};
}
function glowDot(x,y,r,c,alpha=1){
  const g=ctx.createRadialGradient(x,y,0,x,y,r*4);
  g.addColorStop(0,c+'cc'); g.addColorStop(.35,c+'40'); g.addColorStop(1,c+'00');
  ctx.globalAlpha=alpha; ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r*4,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x,y,r*.55,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=c; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=1;
}

function drawNet(){
  t++;
  ctx.clearRect(0,0,W,H);

  // yıldızlar
  stars.forEach(s=>{
    const a=.25+.35*Math.sin(t*0.03+s.ph);
    ctx.fillStyle=`rgba(220,210,255,${a})`; ctx.fillRect(s.x,s.y,s.s,s.s);
  });

  // uydular (sürüklenen küçük düğümler)
  sats.forEach(s=>{
    s.x+=s.vx; s.y+=s.vy;
    if(s.x<0||s.x>W) s.vx*=-1; if(s.y<0||s.y>H) s.vy*=-1;
    const a=.35+.35*Math.sin(t*0.05+s.ph);
    ctx.globalAlpha=a; ctx.fillStyle=s.c; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
  });

  // ana bağlantılar (kesik çizgi akışı)
  const pos=provNodes.map(provPos);
  pos.forEach((q,i)=>{
    const c=PROVIDERS[i].color;
    const b=bez(hub,q,.5);
    ctx.setLineDash([3,6]); ctx.lineDashOffset=-t*0.8;
    ctx.strokeStyle=c+'66'; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.moveTo(hub.x,hub.y); ctx.quadraticCurveTo(b.cx,b.cy,q.x,q.y); ctx.stroke();
    ctx.setLineDash([]);
  });
  // sağlayıcılar arası ince ağ
  for(let i=0;i<pos.length;i++){
    const j=(i+1)%pos.length;
    ctx.strokeStyle='rgba(167,139,250,.14)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(pos[i].x,pos[i].y); ctx.lineTo(pos[j].x,pos[j].y); ctx.stroke();
  }

  // ana hub (SEN) nabız
  const pulse=1+.12*Math.sin(t*0.08);
  const hg=ctx.createRadialGradient(hub.x,hub.y,0,hub.x,hub.y,46*pulse);
  hg.addColorStop(0,'rgba(255,45,149,.55)'); hg.addColorStop(1,'rgba(255,45,149,0)');
  ctx.fillStyle=hg; ctx.beginPath(); ctx.arc(hub.x,hub.y,46*pulse,0,Math.PI*2); ctx.fill();
  glowDot(hub.x,hub.y,9,'#ff2d95');
  ctx.fillStyle='#eee9ff'; ctx.font='bold 10px system-ui'; ctx.textAlign='center';
  ctx.fillText('SEN',hub.x,hub.y+24);

  // sağlayıcı düğümleri
  provNodes.forEach((n,i)=>{
    const q=pos[i], c=n.p.color;
    if(busy[n.p.id]){
      const rr=(t*1.6)%60;
      ctx.strokeStyle=c; ctx.globalAlpha=1-rr/60; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(q.x,q.y,12+rr,0,Math.PI*2); ctx.stroke(); ctx.globalAlpha=1;
    }
    glowDot(q.x,q.y,7,c, state.keys[n.p.id]?1:.35);
    ctx.fillStyle=c; ctx.font='bold 10px system-ui'; ctx.textAlign='center';
    ctx.fillText(n.p.name.toUpperCase(),q.x,q.y+22);
  });

  // paketler (istek ve yanıt)
  packets=packets.filter(p=>{
    p.k+=p.sp; if(p.k>=1){ if(p.onArrive) p.onArrive(); return false; }
    const a=p.from==='hub'?hub:pos[p.idx];
    const b=p.from==='hub'?pos[p.idx]:hub;
    const q=bez(a,b,p.k);
    glowDot(q.x,q.y,2.2,p.c);
    return true;
  });

  // dalgalar
  rings=rings.filter(r=>{ r.age+=1; if(r.age>40) return false;
    ctx.globalAlpha=1-r.age/40; ctx.strokeStyle=r.c; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(r.x,r.y,r.age*2.5,0,Math.PI*2); ctx.stroke(); ctx.globalAlpha=1; return true; });

  requestAnimationFrame(drawNet);
}

function sendPacket(idx){
  const c=PROVIDERS[idx].color;
  packets.push({from:'hub',idx,k:0,sp:.012+Math.random()*.004,c});
}
function returnPacket(idx,onArrive){
  const c=PROVIDERS[idx].color;
  packets.push({from:'prov',idx,k:0,sp:.02,c,onArrive});
}

/* ============ TOKEN GRAFİĞİ ============ */
const chart=$('chart'), cctx=chart.getContext('2d');
function drawChart(){
  const r=chart.getBoundingClientRect(); const d=window.devicePixelRatio||1;
  chart.width=r.width*d; chart.height=r.height*d; cctx.setTransform(d,0,0,d,0,0);
  const w=r.width, h=r.height;
  cctx.clearRect(0,0,w,h);
  cctx.strokeStyle='rgba(167,139,250,.12)'; cctx.setLineDash([2,4]);
  for(let y=8;y<h;y+=18){ cctx.beginPath(); cctx.moveTo(0,y); cctx.lineTo(w,y); cctx.stroke(); }
  cctx.setLineDash([]);
  const data=tokHist.length<2?[0,0]:tokHist;
  const max=Math.max(...data,1);
  const pts=data.map((v,i)=>[i*(w/(data.length-1)), h-6-(v/max)*(h-14)]);
  const g=cctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,'rgba(52,211,153,.45)'); g.addColorStop(1,'rgba(52,211,153,0)');
  cctx.beginPath(); cctx.moveTo(pts[0][0],h);
  pts.forEach(p=>cctx.lineTo(p[0],p[1])); cctx.lineTo(w,h); cctx.closePath();
  cctx.fillStyle=g; cctx.fill();
  cctx.beginPath(); pts.forEach((p,i)=>i?cctx.lineTo(p[0],p[1]):cctx.moveTo(p[0],p[1]));
  cctx.strokeStyle='#34d399'; cctx.lineWidth=2; cctx.shadowColor='#34d399'; cctx.shadowBlur=10; cctx.stroke(); cctx.shadowBlur=0;
  const [lx,ly]=pts[pts.length-1];
  cctx.fillStyle='#fff'; cctx.beginPath(); cctx.arc(lx,ly,3,0,Math.PI*2); cctx.fill();
}

/* ============ SAYAÇLAR ============ */
let shownBal=0;
function animateBalance(){
  const target=state.stats.tok;
  shownBal+= (target-shownBal)*0.15;
  if(Math.abs(target-shownBal)<1) shownBal=target;
  $('balance').textContent=Math.round(shownBal).toLocaleString('tr-TR');
  if(shownBal!==target) requestAnimationFrame(animateBalance);
}
function updateStats(){
  $('pctTxt').textContent=`${state.stats.req} istek · ${state.stats.err} hata`;
  animateBalance(); drawChart(); persist();
}

/* ============ API ÇAĞRISI (OpenAI uyumlu) ============ */
async function callProvider(p,prompt){
  const key=state.keys[p.id];
  if(!key) throw new Error(`${p.name} anahtarı yok. "Anahtarlar" bölümünden ekle.`);
  const model=state.models[p.id]||p.models[0];
  const res=await fetch(`${p.base}/chat/completions`,{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':`Bearer ${key}`},
    body:JSON.stringify({model,messages:[{role:'user',content:prompt}]})
  });
  if(!res.ok){
    let detail=''; try{ detail=(await res.json()).error?.message||''; }catch{}
    throw new Error(`${p.name} ${res.status}: ${detail||res.statusText}`);
  }
  const data=await res.json();
  return { text:data.choices?.[0]?.message?.content||'(boş yanıt)', tok:data.usage?.total_tokens||0, model };
}

/* ============ SOHBET ============ */
const chatEl=$('chat');
function clearEmpty(){ const e=$('emptyMsg'); if(e) e.remove(); }
function addMsg(html,cls,parent=chatEl,style=''){
  clearEmpty();
  const d=document.createElement('div');
  d.className='msg '+cls; if(style) d.setAttribute('style',style);
  d.innerHTML=html; parent.appendChild(d);
  chatEl.scrollTop=chatEl.scrollHeight; return d;
}
function typingBubble(p,parent){
  return addMsg(`<div class="tag" style="--c:${p.color}">${p.glyph} ${p.name} <em>düşünüyor</em></div><div class="typing" style="--c:${p.color}"><i></i><i></i><i></i></div>`,'bot',parent,`--c:${p.color}`);
}

async function askOne(p,prompt,bubble){
  busy[p.id]=true; renderAgents(); sendPacket(PROVIDERS.indexOf(p));
  log('req',`→ ${p.name} · ${state.models[p.id]||p.models[0]}`);
  const t0=performance.now();
  try{
    const r=await callProvider(p,prompt);
    const ms=Math.round(performance.now()-t0);
    lat[p.id].push(ms); if(lat[p.id].length>40) lat[p.id].shift();
    state.stats.req++; state.stats.tok+=r.tok; tokHist.push(state.stats.tok);
    log('ok',`✓ ${p.name} · ${ms} ms · ${r.tok} token`);
    returnPacket(PROVIDERS.indexOf(p),()=>rings.push({x:hub.x,y:hub.y,age:0,c:p.color}));
    fillBubble(bubble,p,{ok:true,text:r.text,model:r.model,ms});
    return {ok:true,ms};
  }catch(e){
    state.stats.err++;
    log('err',`✗ ${p.name}: ${e.message}`);
    fillBubble(bubble,p,{ok:false,text:e.message});
    return {ok:false,ms:null};
  }finally{
    busy[p.id]=false; renderAgents(); updateStats();
  }
}

function fillBubble(el,p,r){
  if(r.ok){
    el.classList.remove('err');
    el.innerHTML=`<div class="tag" style="--c:${p.color}">${p.glyph} ${p.name} <em>${esc(r.model)}</em><span class="ms">${r.ms} ms</span></div>${esc(r.text)}`;
  }else{
    el.classList.add('err');
    el.innerHTML=`<div class="tag" style="--c:${p.color}">${p.glyph} ${p.name}</div>${esc(r.text)}`;
  }
}

async function send(){
  const prompt=$('input').value.trim();
  if(!prompt) return;
  $('input').value='';
  clearEmpty();
  addMsg(esc(prompt),'user');
  log('sys',`soru: "${prompt.slice(0,40)}${prompt.length>40?'…':''}"`);

  const withKey=PROVIDERS.filter(p=>state.keys[p.id]);
  if(!withKey.length){ addMsg('Önce "Anahtarlar" bölümünden en az bir API anahtarı ekle.','bot err'); return; }

  $('send').disabled=true;
  try{
    if(target==='all'){
      const row=document.createElement('div'); row.className='compare'; chatEl.appendChild(row);
      const bubbles=withKey.map(p=>typingBubble(p,row));
      const results=await Promise.all(withKey.map((p,i)=>askOne(p,prompt,bubbles[i])));
      const medals=['🥇','🥈','🥉'];
      results.map((r,i)=>({...r,i})).filter(r=>r.ok).sort((a,b)=>a.ms-b.ms).slice(0,3).forEach((r,k)=>{
        const tg=bubbles[r.i].querySelector('.tag');
        if(tg){ const m=document.createElement('span'); m.textContent=medals[k]; tg.insertBefore(m,tg.firstChild); }
        log('ok',`${medals[k]} ${withKey[r.i].name} en hızlı (${r.ms} ms)`);
      });
    }else{
      let p=target==='auto'?(withKey.find(x=>x.id==='groq')||withKey[0]):withKey.find(x=>x.id===target);
      if(!p){ addMsg(`${PROVIDERS.find(x=>x.id===target).name} anahtarı yok.`,'bot err'); return; }
      await askOne(p,prompt,typingBubble(p));
    }
  }finally{
    $('send').disabled=false; persist();
  }
}
$('send').onclick=send;
$('input').addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); } });

/* ============ ANAHTAR AYARLARI ============ */
const modal=$('modal');
function openSettings(){
  $('keyFields').innerHTML=PROVIDERS.map(p=>`
    <label>${p.glyph} ${p.name} API anahtarı</label>
    <input type="password" data-key="${p.id}" value="${esc(state.keys[p.id]||'')}" placeholder="Anahtar yapıştır">
    <small>Almak için: <a href="${p.keyUrl}" target="_blank" rel="noopener">${p.keyUrl}</a></small>`).join('');
  modal.classList.add('show');
}
$('openSettings').onclick=openSettings;
$('cancelSettings').onclick=()=>modal.classList.remove('show');
$('saveSettings').onclick=()=>{
  modal.querySelectorAll('input[data-key]').forEach(i=>{
    const v=i.value.trim(); if(v) state.keys[i.dataset.key]=v; else delete state.keys[i.dataset.key];
  });
  persist(); modal.classList.remove('show');
  renderAgents(); log('sys','anahtarlar güncellendi');
};

/* ============ SAAT ============ */
function tick(){ $('clock').textContent=new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}); }
setInterval(tick,1000); tick();

/* ============ BAŞLAT ============ */
renderAgents(); renderTargets(); updateStats();
resizeNet(); drawChart(); drawNet();
log('sys','sistem hazır · ağ bağlandı');
if(!Object.keys(state.keys).length) openSettings();
</script>
